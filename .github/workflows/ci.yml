name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "files not gofmt-ed:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: linux-amd64,  goos: linux, goarch: amd64 }
          - { asset: linux-arm64,  goos: linux, goarch: arm64 }
          - { asset: linux-armv7,  goos: linux, goarch: arm,    goarm: "7" }
          - { asset: linux-armv6,  goos: linux, goarch: arm,    goarm: "6" }
          - { asset: linux-mips,   goos: linux, goarch: mips,   gomips: softfloat }
          - { asset: linux-mipsle, goos: linux, goarch: mipsle, gomips: softfloat }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          mkdir -p dist
          out="dist/cfddns-${{ matrix.asset }}"
          go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/cfddns
          chmod +x "$out"
          ls -lh "$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfddns-${{ matrix.asset }}
          path: dist/cfddns-${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14
