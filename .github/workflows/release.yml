name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Leave empty to build current ref without a GitHub Release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test (race)
        run: go test -race -count=1 ./...

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: linux-amd64,  goos: linux, goarch: amd64 }
          - { asset: linux-arm64,  goos: linux, goarch: arm64 }
          - { asset: linux-armv7,  goos: linux, goarch: arm,    goarm: "7" }
          - { asset: linux-armv6,  goos: linux, goarch: arm,    goarm: "6" }
          - { asset: linux-mips,   goos: linux, goarch: mips,   gomips: softfloat }
          - { asset: linux-mipsle, goos: linux, goarch: mipsle, gomips: softfloat }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          mkdir -p dist
          out="dist/cfddns-${{ matrix.asset }}"
          go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/cfddns
          chmod +x "$out"
          ls -lh "$out"
          file "$out" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfddns-${{ matrix.asset }}
          path: dist/cfddns-${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Tag push, or manual dispatch with an explicit tag input.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cfddns-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum cfddns-linux-* | tee SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          notes="$(cat <<EOF
          ## cfddns ${tag}

          Static Linux binaries (\`CGO_ENABLED=0\`), run on glibc and musl (Alpine, OpenWrt).

          | Asset | Targets |
          |-------|---------|
          | \`cfddns-linux-amd64\` | x86_64 servers, VPS, x86 OpenWrt |
          | \`cfddns-linux-arm64\` | aarch64: Raspberry Pi 3/4/5 (64-bit OS), ARM VPS, MT7622/MT7981/MT7986/IPQ807x OpenWrt |
          | \`cfddns-linux-armv7\` | 32-bit ARMv7: Raspberry Pi 2/3 (32-bit OS), IPQ40xx OpenWrt |
          | \`cfddns-linux-armv6\` | Raspberry Pi 1 / Zero |
          | \`cfddns-linux-mipsle\` | MT7620/MT7621 (ramips) OpenWrt |
          | \`cfddns-linux-mips\` | ath79 / big-endian MIPS OpenWrt |

          ### Install (auto-detects arch and init system: systemd, OpenRC, procd)

          \`\`\`sh
          wget -qO- https://raw.githubusercontent.com/${{ github.repository }}/${tag}/install.sh \\
            | sh -s -- -4 home.example.com -token "\$CF_TOKEN"
          \`\`\`

          Verify: \`sha256sum -c SHA256SUMS\`
          EOF
          )"
          # Soft-create: overwrite assets if re-running for same tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/cfddns-linux-* dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/cfddns-linux-* dist/SHA256SUMS \
              --title "cfddns ${tag}" \
              --notes "$notes"
          fi
