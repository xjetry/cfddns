name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0); its source is what gets built. Leave empty to only test and build the current ref."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Test and build exactly as CI does, pinned to the tag being published: a
  # manual dispatch from any branch with a tag input builds that tag's
  # source, never the branch's, so the assets uploaded under the tag are the
  # tag's.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    # Tag push, or manual dispatch with an explicit tag input.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cfddns-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum cfddns-linux-* | tee SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          notes="$(cat <<EOF
          ## cfddns ${tag}

          Static Linux binaries (\`CGO_ENABLED=0\`), run on glibc and musl (Alpine, OpenWrt).

          | Asset | Targets |
          |-------|---------|
          | \`cfddns-linux-amd64\` | x86_64 servers, VPS, x86 OpenWrt |
          | \`cfddns-linux-arm64\` | aarch64: Raspberry Pi 3/4/5 (64-bit OS), ARM VPS, MT7622/MT7981/MT7986/IPQ807x OpenWrt |
          | \`cfddns-linux-armv7\` | 32-bit ARMv7: Raspberry Pi 2/3 (32-bit OS), IPQ40xx OpenWrt |
          | \`cfddns-linux-armv6\` | Raspberry Pi 1 / Zero |
          | \`cfddns-linux-mipsle\` | MT7620/MT7621 (ramips) OpenWrt |
          | \`cfddns-linux-mips\` | ath79 / big-endian MIPS OpenWrt |

          ### Install (auto-detects arch and init system: systemd, OpenRC, procd; verifies SHA256SUMS)

          \`\`\`sh
          wget -qO- https://raw.githubusercontent.com/${{ github.repository }}/${tag}/install.sh \\
            | sh -s -- -4 home.example.com -token "\$CF_TOKEN"
          \`\`\`

          Manual download: verify with \`sha256sum -c SHA256SUMS\`
          EOF
          )"
          # Re-running for the same tag rebuilds the same source (the ref is
          # pinned above) and replaces the assets.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/cfddns-linux-* dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/cfddns-linux-* dist/SHA256SUMS \
              --title "cfddns ${tag}" \
              --notes "$notes"
          fi
